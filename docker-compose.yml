# La password del database arriva da .env (copia di .env.example), mai scritta qui.
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: coworking
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD, copia .env.example in .env}"
    ports:
      # Solo dalla macchina locale, e non sulla 5432 spesso già occupata.
      - "127.0.0.1:5433:5432"
    volumes:
      # Da PostgreSQL 18 il volume è la cartella padre dei dati, non più .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=coworking;Username=coworking;Password=${POSTGRES_PASSWORD}"
      TimeZone: "Europe/Rome"
      # Password della receptionist creata al primo avvio: arriva da .env, mai scritta qui.
      Receptionist__Password: "${RECEPTIONIST_PASSWORD:?manca RECEPTIONIST_PASSWORD, aggiungila a .env (vedi .env.example)}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api
    # URL per il browser sulla macchina che esegue Docker, stampati a ogni avvio.
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          '' \
          'Coworking · collegamenti locali (attendi Ready per aprire il frontend)' \
          '  Applicazione:  http://localhost:3000' \
          '  API (Scalar):  http://localhost:8080/scalar' \
          '  Health API/DB: http://localhost:8080/health' \
          ''
        exec node server.js

volumes:
  db-data:
